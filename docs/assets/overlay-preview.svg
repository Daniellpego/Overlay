<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo ilustrativo da leitura do Overlay</title>
  <desc id="desc">Uma faixa com 144 FPS, 18 milissegundos para o alvo configurado e horário 22:41. Valores fictícios.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c7dfef" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <path d="M36 74V36H74M1126 264h38v-38" fill="none" stroke="#c4f566" stroke-width="2"/>
  <text x="60" y="66" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#a0b0bf">FPS · PING · HORÁRIO</text>
  <rect x="108" y="104" width="984" height="92" rx="16" fill="#000" fill-opacity=".72" stroke="#fff" stroke-opacity=".12"/>
  <text x="146" y="166" font-family="Consolas,'DejaVu Sans Mono',monospace" font-weight="bold" font-size="47" fill="#fff"><tspan fill="#4cd964">144</tspan> FPS | <tspan fill="#4cd964">18</tspan> ms* | 22:41</text>
  <text x="60" y="256" font-family="Arial,sans-serif" font-size="20" fill="#92a1af">LEITURA ILUSTRATIVA</text>
  <text x="1140" y="256" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#92a1af">Valores fictícios · Aparência configurável</text>
</svg>
