# Configuração do overlay. Depois de salvar: clique com o botão direito no ícone da bandeja > "Recarregar config.ini".
# Valor inválido é ignorado (vale o padrão).

# superior-esquerdo | superior-direito | inferior-esquerdo | inferior-direito
canto = superior-direito
margem_x = 12
margem_y = 12

# 0 = primeiro monitor da lista do Windows
monitor = 0

# Fonte monoespaçada evita o overlay "tremer" de largura quando os números mudam.
fonte = Consolas
tamanho_fonte = 11
cor_texto = #FFFFFF

# 0 = sem fundo, 255 = preto sólido
opacidade_fundo = 140

mostrar_segundos = nao

# Ping: com detectar_servidor_jogo = sim (e administrador), procura um destino UDP provável.
# Liderança estável por 2 s e vantagem de 25% reduzem trocas; não confirmam a identidade do servidor.
# ms? = destino provável; ms* = alvo_ping. O menu da bandeja informa o IP medido.
# Esta opção também é aplicada ao usar "Recarregar config.ini".
detectar_servidor_jogo = sim
alvo_ping = 1.1.1.1

# Plano B do FPS (administrador): em bloqueio, ausência ou falta de dados do PresentMon,
# estima atualizações na região da janela ativa e mostra "FPS*"; não confirma FPS renderizado.
# Teto = taxa do monitor. Amostras acumuladas, agrupadas ou que cruzam a borda do jogo são descartadas.
# Incerteza pode deixar "--- FPS*"; consulte o diagnóstico no menu da bandeja.
fps_pela_tela = sim

# Atalho global para ocultar/mostrar (ex.: Ctrl+Shift+F10, Alt+O, F9). "nenhum" desliga.
atalho_ocultar = Ctrl+Shift+F10

# Cores dos números: FPS >= fps_bom fica verde, >= fps_ruim amarelo, abaixo vermelho.
# Ping <= ping_bom verde, <= ping_ruim amarelo, acima vermelho.
cores_por_faixa = sim
fps_bom = 60
fps_ruim = 30
ping_bom = 60
ping_ruim = 120
cor_bom = #4CD964
cor_medio = #FFD60A
cor_ruim = #FF453A
